services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: Abril2026+++
      POSTGRES_DB: emergenciavehiculardb
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/.venv # Evita que la carpeta local sobreescriba el entorno virtual interno
    environment:
      - POSTGRES_HOST=db # Redirige el host al contenedor de base de datos db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=erp
      - POSTGRES_PASSWORD=Abril2026+++
      - POSTGRES_DB=emergenciavehiculardb
    depends_on:
      - db
    restart: always

volumes:
  postgres_data:
